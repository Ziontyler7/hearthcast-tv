# Amazon Vega OS / Fire TV Application Manifest (Kepler Schema v0.1)
schema-version = 1

[package]
id = "com.hearthcast.tv.familynight"
title = "HearthCast TV: Family Trivia & Story Night"
version = "1.0.0"
publisher = "HearthCast Studio"
description = "Interactive 10-foot living-room family trivia blitz and branching bedtime story theater with D-Pad spatial focus, Alexa/Voice command parity, and instant second-screen QR couch party join."

[components]

[[components.interactive]]
id = "com.hearthcast.tv.familynight.main"
runtime-module = "/com.amazon.kepler.keplerscript.runtime.loader_2@IKeplerScript_2_0"
launch-type = "singleton"
categories = ["com.amazon.category.main", "com.amazon.category.game", "com.amazon.category.kids_family"]

[wants]
[[wants.service]]
id = "com.amazon.kepler.media.content_launcher.1"

[[wants.service]]
id = "com.amazon.input.key_events.1"

[[wants.service]]
id = "com.amazon.voice.directive_handler.1"

[offers]
[[offers.interaction]]
id = "com.hearthcast.tv.familynight.main"
uri-schemes = ["hearthcast"]
deep-link-hosts = ["launch", "trivia", "story", "party"]
